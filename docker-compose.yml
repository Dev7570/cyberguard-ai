version: '3.8'

services:
  ml-backend:
    build:
      context: ./cyberguard-backend
      dockerfile: Dockerfile
    container_name: cyberguard-ml-backend
    ports:
      - "5000:5000"
    networks:
      - cyberguard-network
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      - ml-models:/app/models
      - ml-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ./cyberguard-dashboard
      dockerfile: Dockerfile
    container_name: cyberguard-dashboard
    ports:
      - "3000:3000"
    networks:
      - cyberguard-network
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      ml-backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  cyberguard-network:
    driver: bridge

volumes:
  ml-models:
  ml-data:
